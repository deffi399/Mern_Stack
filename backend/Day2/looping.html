<!DOCTYPE html>
<html>
<head>
    <title>Day 2 - JavaScript Looping Tasks</title>
</head>

<body>

    <h1>DAY 2  JAVASCRIPT LOOPING TASKS</h1>


    <script>

 // 1 to 10

for(let i=1;i<=10;i++){
    console.log(i);
    
}

// even numbers 

for(let i=1;i<=20;i++){
    if(i%2==0){
        console.log(i);
        
    }
}

// table 5

let table=5
for(let i=1;i<=10;i++){
    console.log(`${table} x ${i} = ${table*i}`);
    
}

// star pattern


for(let i=1;i<=4;i++){
    pattern=""
    for(let j=1;j<=i;j++){
        pattern+= "* " 
    }
    console.log(pattern);
    
}

// number pattern 

for(let i=1;i<=4;i++){
    pattern=""
    for(let j=1;j<=i;j++){
        pattern+= j + " "
        
    }
    console.log(pattern);
    
}
    </script>

</body>
</html>
