body{
    margin:px;
    display:grid;
    grid-template-areas:
    'nav header header'
    'nav article ads'
    'footer footer footer'

    grid-template-rows;100px 1fr 10%;

}
nav{
    grid-area:nav;
}
footer{
    grid area:footer;
}
header{
    grid area:header
}
