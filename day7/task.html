<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing: border-box;
        }
        body{
            font-family:arial,sans-serif;
            padding: 20px;
            background-color: aliceblue;
        }
        h1{
            text-align: center;
            margin-bottom: 20px;
        }
        .gallery{
            display:flex;
            flex-direction: row;
            justify-content: center;
            gap:20px;
            flex-wrap: wrap;
        }
      
        .item img{
            width:100%;
            height: 250px;
            border-radius: 10px;
        }
        .item p{
            text-align: center;
            margin-top: 10px;
            font-weight:bold;
        }
    </style>

</head>
<body>
    <h1>Flex Image Gallery</h1>
    <div class="gallery">
        <div class="item">
            <img src="https://picsum.photos/300/200?random=1" alt="Image 1">
            <p>image 1</p>
        </div>
        <div class="item">
            <img src="https://picsum.photos/300/200?random=2" alt="Image 2">
            <p>image 2</p>
        </div>
        <div class="item">
            <img src="https://picsum.photos/300/200?random=3" alt="Image 3">
            <p>image 3</p>
        </div>
        <div class="item">
             <img src="https://picsum.photos/300/200?random=4" alt="Image 4">
             <p>image 4</p>
        </div>
        <div class="item">
            <img src="https://picsum.photos/300/200?random=5" alt="Image 5">
            <p>image 5</p>
        </div>
        <div class="item">
            <img src="https://picsum.photos/300/200?random=6" alt="Image 6">
            <p>image 6</p>
    </div>
</body>
</html>
