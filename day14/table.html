<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Card Grid</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container">
    <div class="row">

        <div class="col">
            <div class="card">
                <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb" class="card-img-top" alt="Nature">
                <div class="card-body">
                    <h5 class="card-title">Nature</h5>
                    <p class="card-text">Beautiful mountain scenery.</p>
                    <a href="#" class="btn btn-primary">View</a>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card">
                <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9" class="card-img-top" alt="Person">
                <div class="card-body">
                    <h5 class="card-title">Profile</h5>
                    <p class="card-text">Professional profile card.</p>
                    <a href="#" class="btn btn-success">View</a>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card">
                <img src="https://images.unsplash.com/photo-1494526585095-c41746248156" class="card-img-top" alt="House">
                <div class="card-body">
                    <h5 class="card-title">House</h5>
                    <p class="card-text">Modern home design.</p>
                    <a href="#" class="btn btn-danger">View</a>
                </div>
            </div>
        </div>

    </div>
</div>

</body>
</html>
